syntax = "proto3";

option csharp_namespace = "FaceRetouching.PluginSystem";

package main;

service Plugins {
	rpc Upload (UploadRequest) returns (UploadReply);
	rpc List (ListRequest) returns (ListReply);
	rpc Load (LoadRequest) returns (LoadReply);
}

message UploadRequest {
	string guid = 1;
	string name = 2;
	string description = 3;
	string path = 4;
	bytes lib = 5;
}
message UploadReply {
	bool success = 1;
	string guid = 2;
}

message ListRequest {

}
message ListReply {
	repeated PluginInfo plugins = 1;
}
message PluginInfo {
	string guid = 1;
	string name = 2;
	string description = 3;
	google.protobuf.Timestamp lastUpdate = 4;
}

message LoadRequest {
	string guid = 1;
}
message LoadReply {
	PluginDll dll = 1;
}
message PluginDll {
	string guid = 1;
	string name = 2;
	string description = 3;
	string path = 4;
	bytes lib = 5;
}